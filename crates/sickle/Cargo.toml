[package]
name = "sickle"
version = "0.5.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A robust Rust parser for CCL (Categorical Configuration Language) with Serde support"
homepage = "https://github.com/tylerbutler/santa"
repository.workspace = true
rust-version.workspace = true
keywords = ["ccl", "config", "parser", "categorical", "configuration"]
categories = ["config", "parser-implementations"]
readme = "README.md"

[features]
# Parsing, editing, and rendering are always available.
default = []

# Serde support: `sickle::de` and `sickle::ser`.
serde = ["dep:serde", "dep:serde_derive"]

# String interning for memory efficiency with very large documents.
intern = ["dep:string-interner"]

# Everything above.
full = ["serde", "intern"]

# Spec-compliance surface used by the CCL test suites. Not covered by semver.
unstable = []

[dependencies]
# Optional: Serde support
serde = { workspace = true, optional = true }
serde_derive = { version = "1.0.228", optional = true }

# Optional: String interning for memory efficiency
string-interner = { version = "0.20.0", optional = true }

[dev-dependencies]
# Testing framework
serde.workspace = true
serde_json.workspace = true
colored.workspace = true

# Enable all features for tests
[dev-dependencies.sickle]
path = "."
features = ["full", "unstable"]

[[example]]
name = "documents"
path = "examples/documents.rs"

[[example]]
name = "editing"
path = "examples/editing.rs"

[[example]]
name = "serde_usage"
path = "examples/serde_usage.rs"
required-features = ["serde"]
